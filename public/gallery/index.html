<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery</title>
  <link rel="stylesheet" type="text/css" href="./index.css" />
  <link rel="stylesheet" type="text/css" href="../style.css" />
</head>

<body>

  <div class="filters">
    <div class="filter-item">
      <label for="from">From:</label>
      <input type="date" id="from" />
    </div>

    <div class="filter-item">
      <label for="to">To:</label>
      <input type="date" id="to" />
    </div>

    <button id="find-button">Find</button>
  </div>

  <div id="status-message" style="text-align: center; margin-top: 20px; font-weight: bold; color: red;"></div>
  <div id="image-container" style="display: flex; flex-wrap: wrap; justify-content: center">
    <div class="image-wrapper skeleton"></div>
    <div class="image-wrapper skeleton" style="display: none;"></div>
    <div class="image-wrapper skeleton" style="display: none;"></div>
    <div class="image-wrapper skeleton" style="display: none;"></div>
    <div class="image-wrapper skeleton" style="display: none;"></div>
    <div class="image-wrapper skeleton" style="display: none;"></div>
  </div>


  <script src="gallery.js"></script>
</body>

</html>
